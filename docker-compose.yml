services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: websentinel_dev
      POSTGRES_USER: websentinel
      POSTGRES_PASSWORD: websentinel
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata: