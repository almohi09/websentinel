name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: websentinel_test
          POSTGRES_USER: websentinel
          POSTGRES_PASSWORD: websentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & test backend
        working-directory: websentinel-backend
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_URL: jdbc:postgresql://localhost:5432/websentinel_test
          DB_USERNAME: websentinel
          DB_PASSWORD: websentinel
          JWT_SECRET: ci-test-secret-not-for-prod
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: websentinel-frontend/package-lock.json
      - name: Install & test frontend
        working-directory: websentinel-frontend
        run: |
          npm ci
          npm test -- --watchAll=false
          npm run build
        continue-on-error: true